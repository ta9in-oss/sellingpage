name: Deploy Merchant Store

on:
  repository_dispatch:
    types: [deploy-store]

# Serialise per store rather than cancelling. Cancelling raced badly: the
# cancelled run's status write could land after the replacement run had already
# reported `building`, leaving a live deploy looking failed. Queueing is also
# what a merchant means by clicking Publish twice — they want the latest state
# deployed, not the first attempt killed.
concurrency:
  group: deploy-store-${{ github.event.client_payload.storeId }}
  cancel-in-progress: false

jobs:
  deploy-store:
    runs-on: ubuntu-latest
    # A hung job must not hold the per-store concurrency slot for GitHub's
    # 6-hour default; the merchant is watching a spinner the whole time.
    timeout-minutes: 20
    env:
      VITE_INSTANT_APP_ID: ${{ secrets.PLATFORM_VITE_INSTANT_APP_ID }}
      PLATFORM_INSTANTDB_ADMIN_TOKEN: ${{ secrets.PLATFORM_INSTANTDB_ADMIN_TOKEN }}
      # Opens the merchant secrets sealed by the platform. Must be byte-identical
      # to the STORE_SECRET_KEY Pages secret on 7aba-platform.
      STORE_SECRET_KEY: ${{ secrets.STORE_SECRET_KEY }}
      STORE_ID: ${{ github.event.client_payload.storeId }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mark building
        run: node scripts/set-store-status.mjs --store-id="$STORE_ID" --status=building

      - name: Generate store config from InstantDB
        id: gen
        run: pnpm exec tsx scripts/generate-store-config.mjs --store-id="$STORE_ID"

      - name: Build store
        env:
          CF_PAGES: '1' # selects the cloudflare-pages preset → output in apps/store/dist
          VITE_INSTANT_APP_ID: ${{ steps.gen.outputs.instant_app_id }}
          VITE_APP_URL: https://7aba-${{ steps.gen.outputs.slug }}.pages.dev
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm --filter store build

      - name: Deploy to merchant's Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.gen.outputs.cf_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.gen.outputs.cf_account_id }}
        run: |
          # `pages deploy` prompts to create a missing project, which hangs in CI.
          # Creating it up front is idempotent enough: a second create just errors.
          npx wrangler pages project create "7aba-${{ steps.gen.outputs.slug }}" \
            --production-branch=main || echo "project already exists, continuing"
          npx wrangler pages deploy apps/store/dist \
            --project-name="7aba-${{ steps.gen.outputs.slug }}" \
            --branch=main \
            --commit-dirty=true

      - name: Mark live
        if: success()
        run: |
          node scripts/set-store-status.mjs \
            --store-id="$STORE_ID" \
            --status=live \
            --url="https://7aba-${{ steps.gen.outputs.slug }}.pages.dev"

      # `failure()` alone misses cancellation and timeout, which would strand the
      # store at `building` with nothing left to move it.
      - name: Mark failed
        if: failure() || cancelled()
        run: node scripts/set-store-status.mjs --store-id="$STORE_ID" --status=failed
