name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-platform:
    name: Deploy Platform (7aba-platform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build platform
        working-directory: apps/platform
        env:
          CF_PAGES: '1'
          VITE_INSTANT_APP_ID: ${{ secrets.PLATFORM_VITE_INSTANT_APP_ID }}
          VITE_APP_URL: https://7aba-platform.pages.dev
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm build

      - name: Deploy platform to Cloudflare Pages
        working-directory: apps/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .output \
            --project-name=7aba-platform \
            --commit-dirty=true \
            ${{ github.ref == 'refs/heads/main' && '--branch=main' || '' }}

  deploy-store:
    name: Deploy Store Demo (7aba-store)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build store
        working-directory: apps/store
        env:
          CF_PAGES: '1'
          VITE_INSTANTDB_APP_ID: ${{ secrets.STORE_VITE_INSTANTDB_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm build

      - name: Deploy store to Cloudflare Pages
        working-directory: apps/store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .output \
            --project-name=7aba-store \
            --commit-dirty=true \
            ${{ github.ref == 'refs/heads/main' && '--branch=main' || '' }}

