name: Deploy platform

# Manual only: a public repository must not deploy to production on every push.
# Requires the CLOUDFLARE_API_TOKEN secret and the repository variables below.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-platform:
    name: Deploy platform to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build platform
        working-directory: apps/platform
        env:
          CF_PAGES: '1'
          VITE_INSTANT_APP_ID: ${{ vars.VITE_INSTANT_APP_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_INSTANTDB_OAUTH_CLIENT_ID: ${{ vars.VITE_INSTANTDB_OAUTH_CLIENT_ID }}
        run: pnpm build
      - name: Deploy
        working-directory: apps/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
