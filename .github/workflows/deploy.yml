name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-platform:
    name: Deploy Platform (7aba-platform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build platform
        working-directory: apps/platform
        env:
          CF_PAGES: '1'
          VITE_INSTANT_APP_ID: b9227417-33f4-4c3d-9c88-612e094aff89
          VITE_APP_URL: https://7aba.store
          VITE_GOOGLE_CLIENT_ID: 16915599620-b4cv7djgvok8agu1lpb2cbcdfjifbu93.apps.googleusercontent.com
          VITE_CHARGILY_PUBLIC_KEY: test_pk_9MgGDzJQ03LZzxaGGEiShDsRz1BL4tCRBJFHJcEb
        run: pnpm build

      - name: Deploy platform to Cloudflare Pages
        working-directory: apps/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: <cloudflare-account-id>
        run: |
          npx wrangler pages deploy dist \
            --project-name=7aba-platform \
            --commit-dirty=true \
            ${{ github.ref == 'refs/heads/main' && '--branch=main' || '' }}



