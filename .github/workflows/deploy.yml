name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-platform:
    name: Deploy Platform (7aba-platform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build platform
        working-directory: apps/platform
        env:
          CF_PAGES: '1'
          VITE_INSTANT_APP_ID: b9227417-33f4-4c3d-9c88-612e094aff89
          VITE_APP_URL: https://7aba.app
          VITE_GOOGLE_CLIENT_ID: 1031735082979-bjhvq3ulo8gsmebkeihkalh3gohoropm.apps.googleusercontent.com
          VITE_META_PIXEL_ID: '322683491235522'
          # Public OAuth client ids (not secrets) — inlined by Vite to render the
          # "connect" buttons. The matching *_CLIENT_SECRET values are runtime-only
          # and set as encrypted Pages secrets, never here.
          #
          # VITE_CF_OAUTH_CLIENT_ID is intentionally NOT set: the Cloudflare
          # self-managed OAuth client is still private/pending approval, so its
          # "Connect Cloudflare" button cannot authorize arbitrary merchants yet.
          # With it absent, cfOAuthAvailable is false and merchants use manual
          # API-token entry instead. Re-add this line once the CF client is public.
          VITE_INSTANTDB_OAUTH_CLIENT_ID: be194d93-775f-4b2f-b312-04996c0f5acf
        run: pnpm build

      - name: Deploy platform to Cloudflare Pages
        working-directory: apps/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: <cloudflare-account-id>
        run: |
          npx wrangler pages deploy dist \
            --project-name=7aba-platform \
            --commit-dirty=true \
            ${{ github.ref == 'refs/heads/main' && '--branch=main' || '' }}



