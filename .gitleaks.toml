# gitleaks config: default rules + an allowlist for known non-secrets.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and public OAuth client IDs"
paths = [
  '''apps/platform/src/lib/secretBox\.test\.ts''',
]
regexes = [
  # Fake AES key shared by the secretBox / generate-store-config test fixtures.
  '''z7Zq3pQm1sVn8xYbK4dHtL6eR0aWfJcUgO2iN5vT9uE=''',
  # Public OAuth client IDs: they're sent to the browser by design.
  '''8e55e2088cfacd60b74c2199b30a3a8d''',
  '''be194d93-775f-4b2f-b312-04996c0f5acf''',
]
